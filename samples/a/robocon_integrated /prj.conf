# Robocon Integrated Demo Configuration

# 基础配置
CONFIG_MAIN_THREAD_PRIORITY=7
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# 电机驱动支持
CONFIG_MOTOR=y
CONFIG_MOTOR_DJI=y
CONFIG_MOTOR_DM=y

# SBUS 支持
CONFIG_ARES=y
CONFIG_ARES_SBUS=y
CONFIG_SBUS_LOG_LEVEL=4
CONFIG_SBUS_INIT_PRIORITY=90

# CAN总线支持
CONFIG_CAN=y
CONFIG_CAN_INIT_PRIORITY=80

# PID控制器支持
CONFIG_PID=y

# GPIO 支持 (电磁阀)
CONFIG_GPIO=y

# 日志支持
CONFIG_LOG=y
CONFIG_UART_CONSOLE=y